<!doctype html>
<meta charset="utf-8">
<title>Magnetite Poster: Rails</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Mockup of a Rails poster meter: the railway lines of western Europe, taken from a screenshot of a rail map (OpenRailwayMap, whose
   data is (c) OpenStreetMap contributors, ODbL: the credit has to stay on the poster). The screenshot was cut into four
   transparent masks (the orange lines, the red lines, the station markers, the land) embedded below, so the poster is made of
   the map's own lines, not redrawn. Meters: the lines are dim; diagonal strips across the map light up in turn with the 30
   bands (bass at one edge, highs at the other); the red lines (the fast ones) follow the loudness and flash on bass onsets;
   the station rings flash on onsets; the time played is only in the text. Fake signal, no audio. */
:root { --bg:#121212; --fg:#d8d8d8; --muted:#8a8a8a; --mono: ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 20px var(--mono); margin: 0; }
p { margin: 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font: 13px var(--mono); background: #242424; color: var(--fg); border: 1px solid #444; padding: 6px 10px; cursor: pointer; }
label { font: 13px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 6px; }
figcaption { font: 12px/1.45 var(--mono); color: var(--muted); }
canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border: 1px solid #333; }
</style>
<div class="wrap">
  <h1>Poster: Rails</h1>
  <p>The railway network of western Europe as a meter, cut from a screenshot of a rail map: diagonal strips of the map light with the 30 bands, the red (fast) lines follow the loudness, and the stations flash on bass onsets. Data: OpenRailwayMap, © OpenStreetMap contributors.</p>
  <div class="bar">
    <button id="next">next track</button>
    <label><input id="text" type="checkbox" checked> text</label>
    <label><input id="auto" type="checkbox" checked> auto level</label>
    <label>level <input id="lvl" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>
  <div class="grid" id="grid"></div>
</div>

];
let ti = 0;
const $ = (id) => document.getElementById(id);
const NB = 30;
const clamp = (v) => Math.max(0, Math.min(1, v));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function fakeBands(t, base) {
  return Array.from({ length: NB }, (_, i) => {
    const tilt = 1 - i / (NB * 1.7);
    const v = 0.42 + 0.24 * Math.sin(t * (0.9 + i * 0.21) + i) + 0.4 * Math.pow(Math.max(0, Math.sin(t * (3.1 - i * 0.08) + i * 0.9)), 6);
    return clamp(v * tilt * base);
  });
}

// ---- small drawing helpers
function path(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function plen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return d; }
function at(p, d) {
  for (let i = 1; i < p.length; i++) {
    const l = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= l) { const k = d / l; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * k, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * k]; }
    d -= l;
  }
  return p[p.length - 1];
}
function quad(a, c, b, n = 18) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; }); }
function arrow(g, p, fill, size = 9) {
  const [x, y] = p[p.length - 1], [px, py] = p[p.length - 2], a = Math.atan2(y - py, x - px);
  g.beginPath(); g.moveTo(x + 2 * Math.cos(a), y + 2 * Math.sin(a));
  g.lineTo(x - size * Math.cos(a - 0.42), y - size * Math.sin(a - 0.42));
  g.lineTo(x - size * Math.cos(a + 0.42), y - size * Math.sin(a + 0.42)); g.closePath();
  g.save(); g.fillStyle = fill; g.fill(); g.restore(); g.stroke();
}
function T(g, s, x, y, o) {
  g.font = `${o.weight || 400} ${o.size || 10.5}px ${o.font || SANS}`;
  g.letterSpacing = `${o.ls ?? 1.3}px`;
  g.textAlign = o.align || 'left'; g.fillStyle = o.color;
  g.fillText(s, x, y); g.letterSpacing = '0px';
}
function box3(g, x, y, w, h, dx, dy, bg) {
  g.save(); g.fillStyle = bg;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w, y); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w + dx, y + h + dy); g.lineTo(x + w, y + h); g.closePath(); g.fill(); g.stroke();
  g.fillRect(x, y, w, h); g.strokeRect(x, y, w, h); g.restore();
}
function cyl(g, cx, cy, rx, ry, h, amt, pal) {
  const bot = cy + h;
  g.beginPath(); g.moveTo(cx - rx, cy); g.lineTo(cx - rx, bot); g.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true);
  g.lineTo(cx + rx, cy); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI, true); g.closePath();
  g.save(); g.fillStyle = pal.bg; g.fill(); g.clip();
  g.globalAlpha = 0.85; g.fillStyle = pal.acc; g.fillRect(cx - rx - 2, bot + ry - amt * (h + ry), rx * 2 + 4, h + ry * 2);
  g.restore(); g.stroke();
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.save(); g.fillStyle = pal.bg; g.fill(); g.restore(); g.stroke();
}

const bandAt = (arr, x) => { const i = Math.max(0, Math.min(NB - 1, Math.floor(x))), f = Math.max(0, Math.min(1, x - i)); return arr[i] * (1 - f) + arr[Math.min(NB - 1, i + 1)] * f; };
const IMG = {}, tints = new Map();
function tint(name, color) { const key = name + color; if (!tints.has(key)) { const c = document.createElement('canvas'); c.width = MW; c.height = MH; const g = c.getContext('2d'); g.drawImage(IMG[name], 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, MW, MH); tints.set(key, c); } return tints.get(key); }

function draw(c, pal, st, o) {
  const g = c.getContext('2d');
  const dpr = devicePixelRatio || 1;
  const cw = c.clientWidth, ch = c.clientHeight;
  if (c.width !== Math.round(cw * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  const s = Math.min(c.width / W, c.height / H);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = pal.bg; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(s, 0, 0, s, (c.width - W * s) / 2, (c.height - H * s) / 2);
  const tr = TRACKS[ti];

  const k = 1 - Math.exp(-o.dt / 0.12);
  for (let i = 0; i < NB; i++) st.b[i] += (o.bands[i] - st.b[i]) * k;
  const mean = st.b.reduce((a, b) => a + b, 0) / NB;
  st.lv += (mean - st.lv) * (1 - Math.exp(-o.dt / 0.3));
  st.cool -= o.dt; st.on = Math.max(0, st.on - o.dt * 2.8);
  const bass = (o.bands[0] + o.bands[1] + o.bands[2]) / 3; st.avg += (bass - st.avg) * (1 - Math.exp(-o.dt / 0.6));
  if (st.cool <= 0 && bass > st.avg * 1.3 + 0.04) { st.on = 1; st.cool = 0.2; }
  const lv = clamp(st.lv * 1.5);

  const draw1 = (name, color, alpha) => { g.globalAlpha = alpha; g.drawImage(tint(name, color), 0, 0, W, H); g.globalAlpha = 1; };
  // land, the dim network
  draw1('land', pal.land, 1);
  draw1('orange', pal.orange, 0.3);
  // diagonal strips lit by the 30 bands
  const NS = 70, span = 1100;
  for (let i = 0; i < NS; i++) {
    const v = clamp(bandAt(st.b, i / (NS - 1) * (NB - 1)) * 1.3), x0 = -span / 2 + i * span / NS;
    const cs = Math.cos(0.5), sn = Math.sin(0.5), P = (x, y) => [W / 2 + x * cs - y * sn, H / 2 + x * sn + y * cs];
    g.save(); g.beginPath(); const a = P(x0, -900), b = P(x0 + span / NS + 0.8, -900), c2 = P(x0 + span / NS + 0.8, 900), d = P(x0, 900); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c2[0], c2[1]); g.lineTo(d[0], d[1]); g.closePath(); g.clip();
    g.globalAlpha = clamp(v * 1.05); g.drawImage(tint('orange', pal.hot), 0, 0, W, H); g.restore();
  }
  // the fast lines follow the loudness and flash on onsets; the stations flash too
  draw1('red', pal.red, clamp(0.5 + lv * 0.5 + st.on * 0.3));
  draw1('stn', pal.stn, 0.85);
  if (st.on > 0.05) { g.save(); g.globalAlpha = st.on * 0.8; g.drawImage(tint('stn', pal.hot), -2, -2, W + 4, H + 4); g.restore(); }
  // ---- legibility bands and the text
  const top = g.createLinearGradient(0, 0, 0, 170); top.addColorStop(0, pal.bg); top.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha = 0.92; g.fillStyle = top; g.fillRect(0, 0, W, 170); g.restore();
  const bot = g.createLinearGradient(0, H - 90, 0, H); bot.addColorStop(0, 'rgba(0,0,0,0)'); bot.addColorStop(1, pal.bg); g.save(); g.globalAlpha = 0.92; g.fillStyle = bot; g.fillRect(0, H - 90, W, 90); g.restore();
  if (o.text) {
    const T2 = (t, x, y, size, col, al = 'left', wt = 700, ls = 0) => { g.font = `${wt} ${size}px ${HELV}`; g.letterSpacing = `${ls}px`; g.textAlign = al; g.fillStyle = col; g.fillText(t, x, y); g.letterSpacing = '0px'; };
    const words = tr.title.split(/\s+/); let fit = null;
    for (let size = 44; size >= 18 && !fit; size--) {
      g.font = `700 ${size}px ${HELV}`; const lines = []; let cur = '';
      for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width <= 440 || !cur) cur = t; else { lines.push(cur); cur = w; } }
      lines.push(cur); if (lines.length <= 2 && lines.every((l) => g.measureText(l).width <= 440)) fit = { size, lines };
    }
    fit = fit || { size: 18, lines: [tr.title] };
    fit.lines.forEach((l, i) => T2(l, 30, 30 + fit.size * 0.92 + i * fit.size * 1.02, fit.size, pal.ink, 'left', 700, -0.8));
    const y = 30 + fit.size * 0.92 + (fit.lines.length - 1) * fit.size * 1.02 + 20;
    T2(`${tr.name}${tr.album ? ' · ' + tr.album : ''}${tr.year ? ' · ' + tr.year : ''}`.slice(0, 58), 30, y, 13, pal.mute, 'left', 500, 0.2);
    T2(`${tr.codec} ${tr.bits}${tr.dr ? ' · ' + tr.dr : ''} · ${mmss(o.played * tr.dur)} / ${mmss(tr.dur)}`, 30, y + 17, 11, pal.mute, 'left', 500, 0.3);
    T2('Rail lines: OpenRailwayMap  ·  © OpenStreetMap contributors', 570, 788, 8.5, pal.mute, 'right', 500, 0.2);
  }
}

const cards = PALS.map(([label, pal]) => {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  f.append(c, cap);
  $('grid').append(f);
  return { c, pal, st: { b: new Array(NB).fill(0), lv: 0, avg: 0, cool: 0, on: 0 } };
});

let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now; clock += dt;
  const auto = $('auto').checked;
  const o = { dt, clock, bands: fakeBands(clock, auto ? 1.15 : +$('lvl').value * 2), played: (clock % 40) / 40, text: $('text').checked };
  cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o));
  requestAnimationFrame(frame);
}
$('next').onclick = () => { ti = (ti + 1) % TRACKS.length; };
let loaded = 0; const names = Object.keys(SRC);
names.forEach((n) => { IMG[n] = new Image(); IMG[n].onload = () => { if (++loaded < names.length) return;
  for (let i = 0; i < 40; i++) { clock += 0.05; const o = { dt: 0.05, clock, bands: fakeBands(clock, 1.15), played: (clock % 40) / 40, text: true }; cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o)); }
  last = performance.now(); requestAnimationFrame(frame); }; IMG[n].src = SRC[n]; });
</script>
