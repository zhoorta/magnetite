<!doctype html>
<meta charset="utf-8">
<title>Magnetite Poster: Network</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Mockup of a Network poster meter: the Berlin U-Bahn map from Wikimedia Commons (File:U-Bahn_Berlin_-_Netzplan.svg, drawn by its
   Commons author; check the licence on its file page before this is built into the app), turned a quarter so its long side runs
   down the poster. berlin-ubahn.svg is that file trimmed (all station names, editor data and ids removed: 84 KB, no labels) with its nine line
   colours turned to a pale grey (only the stroke of the 16 route paths); berlin-ubahn-dark.svg is the same with the neutrals swapped
   (white ground to near-black, black outlines to light); the real colours come back on top, live. Eight lines are the eight band groups (U9 the
   bass, U4 the highs): a line is coloured from the start of its route as far as its band's level, and a white dot rides at the
   held peak. U5 is the time played: a train runs along it, the line coloured behind it. Fake signal, no audio. */
:root { --bg:#121212; --fg:#d8d8d8; --muted:#8a8a8a; --mono: ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 20px var(--mono); margin: 0; }
p { margin: 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font: 13px var(--mono); background: #242424; color: var(--fg); border: 1px solid #444; padding: 6px 10px; cursor: pointer; }
label { font: 13px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 6px; }
figcaption { font: 12px/1.45 var(--mono); color: var(--muted); }
canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border: 1px solid #333; }
</style>
<div class="wrap">
  <h1>Poster: Network</h1>
  <p>The Berlin U-Bahn map as a meter: each line is a band group and is coloured from its start as far as the level, with a dot at the held peak; U5 carries a train for the time played.</p>
  <div class="bar">
    <button id="next">next track</button>
    <label><input id="text" type="checkbox" checked> text</label>
    <label><input id="auto" type="checkbox" checked> auto level</label>
    <label>level <input id="lvl" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const W = 600, H = 800, TAU = Math.PI * 2;
const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const MONO = 'ui-monospace, Menlo, Consolas, monospace';
const PALS = [
  ['White', { bg:'#ffffff', ink:'#15171b', mute:'#7a7d84' }],
  ['Cream', { bg:'#efe9d8', ink:'#1b1812', mute:'#7d7766', multiply:true }],
  ['Dark', { bg:'#15171b', ink:'#f0eee6', mute:'#8a8e96', dark:true }],
];
const TT = { black:'#000', green:'#2bff4a', yellow:'#ffee2e', red:'#ff3b2e', cyan:'#2ee6ff', white:'#f4f4f4', blue:'#1a2cff' };
const TRACKS = [
  { name:'Ana Duarte', title:'Maré Cheia', album:'Ilhas', year:'2024', codec:'FLAC', bits:'24/96', dr:'DR12', dur:274, n:3, of:12 },
  { name:'Night Ferry', title:'Eleven Miles of Fog and Static', album:'Long Crossings, Vol. 2', year:'1998', codec:'ALAC', bits:'16/44', dr:'DR7', dur:468, n:11, of:14 },
  { name:'Mono', title:'Tape 3', album:'', year:'', codec:'MP3', bits:'320', dr:'', dur:125, n:1, of:1 },
];
let ti = 0;
const $ = (id) => document.getElementById(id);
const NB = 30;
const clamp = (v) => Math.max(0, Math.min(1, v));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function fakeBands(t, base) {
  return Array.from({ length: NB }, (_, i) => {
    const tilt = 1 - i / (NB * 1.7);
    const v = 0.42 + 0.24 * Math.sin(t * (0.9 + i * 0.21) + i) + 0.4 * Math.pow(Math.max(0, Math.sin(t * (3.1 - i * 0.08) + i * 0.9)), 6);
    return clamp(v * tilt * base);
  });
}

// ---- small drawing helpers
function path(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function plen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return d; }
function at(p, d) {
  for (let i = 1; i < p.length; i++) {
    const l = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= l) { const k = d / l; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * k, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * k]; }
    d -= l;
  }
  return p[p.length - 1];
}
function quad(a, c, b, n = 18) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; }); }
function arrow(g, p, fill, size = 9) {
  const [x, y] = p[p.length - 1], [px, py] = p[p.length - 2], a = Math.atan2(y - py, x - px);
  g.beginPath(); g.moveTo(x + 2 * Math.cos(a), y + 2 * Math.sin(a));
  g.lineTo(x - size * Math.cos(a - 0.42), y - size * Math.sin(a - 0.42));
  g.lineTo(x - size * Math.cos(a + 0.42), y - size * Math.sin(a + 0.42)); g.closePath();
  g.save(); g.fillStyle = fill; g.fill(); g.restore(); g.stroke();
}
function T(g, s, x, y, o) {
  g.font = `${o.weight || 400} ${o.size || 10.5}px ${o.font || SANS}`;
  g.letterSpacing = `${o.ls ?? 1.3}px`;
  g.textAlign = o.align || 'left'; g.fillStyle = o.color;
  g.fillText(s, x, y); g.letterSpacing = '0px';
}
function box3(g, x, y, w, h, dx, dy, bg) {
  g.save(); g.fillStyle = bg;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w, y); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w + dx, y + h + dy); g.lineTo(x + w, y + h); g.closePath(); g.fill(); g.stroke();
  g.fillRect(x, y, w, h); g.strokeRect(x, y, w, h); g.restore();
}
function cyl(g, cx, cy, rx, ry, h, amt, pal) {
  const bot = cy + h;
  g.beginPath(); g.moveTo(cx - rx, cy); g.lineTo(cx - rx, bot); g.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true);
  g.lineTo(cx + rx, cy); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI, true); g.closePath();
  g.save(); g.fillStyle = pal.bg; g.fill(); g.clip();
  g.globalAlpha = 0.85; g.fillStyle = pal.acc; g.fillRect(cx - rx - 2, bot + ry - amt * (h + ry), rx * 2 + 4, h + ry * 2);
  g.restore(); g.stroke();
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.save(); g.fillStyle = pal.bg; g.fill(); g.restore(); g.stroke();
}


const HELV = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const PATHS = [{"line": "U5", "color": "#7e5330", "d": "m 5108.9751,1174.2292 c 0,0 591.1222,2e-4 600.2262,2e-4 9.104,0 14.1007,5.8084 14.1007,5.8084 l 56.621,56.6212 c 0,0 4.7336,5.8088 14.1028,5.8089 9.3692,0 14.2304,-5.9221 14.2304,-5.9221 l 171.8271,-171.8269", "w": 8.0, "dash": null}, {"line": "U8", "color": "#224f86", "d": "M 5386.7812,1537.8275 V 1153.795 c 0,0 0.574,-7.6404 -5.8635,-14.0779 -3.2842,-3.2841 -88.7947,-88.795 -188.5758,-188.57603", "w": 8.0, "dash": null}, {"line": "U6", "color": "#8c6dab", "d": "m 5269.0224,1666.8405 v -498.6816 c 0,0 0.574,-7.6403 -5.8635,-14.0778 -6.4375,-6.4375 -226.1742,-226.17432 -226.1742,-226.17432", "w": 8.0, "dash": null}, {"line": "U6", "color": "#8c6dab", "d": "m 5038.7739,929.92796 c -6.4375,-6.4375 -108.1742,-108.17432 -108.1742,-108.17432", "w": 4.0, "dash": "4, 4"}, {"line": "U7", "color": "#528dba", "d": "m 5053.8075,1447.536 53.5478,-2e-4 c 0,0 7.6468,0.6134 14.1269,-5.8668 26.3834,-26.3835 76.4211,-76.4207 76.4211,-76.4207 0,0 5.0603,-5.8483 14.1643,-5.8483 0,0 7.8339,-0.4179 14.1464,5.8945 6.3127,6.3125 57.4028,57.7563 57.4028,57.7563 0,0 4.8894,5.8269 14.1392,5.8266 9.2501,3e-4 128.3917,10e-5 128.3917,10e-5 0,0 7.7924,-0.5044 14.136,5.8395 6.3439,6.3436 256.4139,256.4139 256.4139,256.4139", "w": 8.0, "dash": null}, {"line": "U7", "color": "#528dba", "d": "m 5080.2396,1447.5231 h -232.68 c 0,0 -7.7436,0.5695 -14.1738,-5.8606 -6.4304,-6.4305 -24.5872,-24.5873 -24.5872,-24.5873 0,0 -5.8935,-4.9886 -5.8935,-14.1762 v -243.682 c 0,0 0.464,-7.7892 -5.8116,-14.0647 -6.2755,-6.2756 -12.551,-5.9221 -14.2304,-5.922 -1.6795,-10e-5 -338.7044,-10e-5 -338.7044,-10e-5", "w": 8.0, "dash": null}, {"line": "U9", "color": "#f3791d", "d": "m 4901.2653,1623.5379 c 0,0 34.4558,-34.4558 40.831,-40.8308 6.375,-6.375 5.8321,-14.1121 5.8321,-14.1121 v -245.4154", "w": 8.0, "dash": null}, {"line": "U9", "color": "#f3791d", "d": "m 4947.9284,1334.5938 v -133.1046 c 0,0 -0.663,-7.635 5.8336,-14.1315 l 237.8972,-237.89721", "w": 8.0, "dash": null}, {"line": "U8", "color": "#224f86", "d": "m 5084.0858,756.08708 v 78.56239 c 0,0 -0.574,7.64044 5.8635,14.07794 3.2842,3.28422 0.4636,0.46339 100.2446,100.24447", "w": 8.0, "dash": null}, {"line": "U3", "color": "#007a5b", "d": "m 4664.7384,1671.2355 317.7876,-317.7877 c 0,0 5.2643,-5.8695 14.1706,-5.8695 8.9063,0 542.1549,0 542.1549,0", "w": 8.0, "dash": null}, {"line": "U1", "color": "#7dad4c", "d": "m 4880.2939,1335.6442 659.2502,2e-4", "w": 8.0, "dash": null}, {"line": "U2", "color": "#da421e", "d": "m 4803.3694,1260.4551 c 70.6487,-10e-5 113.8576,-10e-5 117.5589,-10e-5 9.1251,-10e-5 14.1385,5.8283 14.1385,5.8283 l 52.1155,52.1155 c 0,0 5.2646,5.8696 14.1707,5.8694 2.3364,10e-5 40.1973,2e-4 68.1435,2e-4 0,0 7.1953,-0.1555 12.7962,5.4429 l 38.1975,38.1975 c 0,0 5.1767,5.864 14.114,5.8641 8.9374,0 13.6874,-5.375 14.1876,-5.875 0.5001,-0.5001 5.8126,-5.3125 5.8122,-14.1249 0,-3.7054 0.088,-13.6545 0.088,-13.6135", "w": 8.0, "dash": null}, {"line": "U2", "color": "#da421e", "d": "m 4801.6015,1260.4548 c -101.9792,0 -126.3024,0 -126.3024,0 0,0 -7.4734,0.861 -14.1468,-5.8124 -6.6733,-6.6733 -71.6117,-71.6119 -71.6117,-71.6119", "w": 8.0, "dash": null}, {"line": "U2", "color": "#da421e", "d": "m 5154.605,1336.1594 c 0,-20.2688 0,-59.938 0,-59.938 0,0 -0.2552,-8.049 5.8383,-14.1429 6.0938,-6.0937 13.1251,-5.8749 14.1876,-5.8749 0.549,0 57.2178,0 93.4176,0", "w": 8.0, "dash": null}, {"line": "U2", "color": "#da421e", "d": "m 5252.7607,1256.2036 c 31.6906,10e-5 43.7308,0 43.7308,0 0,0 7.9799,0.326 14.1048,-5.7992 6.1249,-6.1251 122.4735,-122.4736 122.4735,-122.4736 0,0 5.8331,-5.1409 5.8332,-14.1123 0,-8.9715 -1e-4,-129.53908 -1e-4,-129.53908", "w": 8.0, "dash": null}, {"line": "U4", "color": "#f0d722", "d": "m 5053.8422,1348.8155 3e-4,181.9355", "w": 8.0, "dash": null}];
const SVGW = 1660.094, SVGH = 1003.688, LAYER = [-4368.7187, -728.25];
const MS = 0.42, MCX = 300, MCY = 412;                                  // the map, turned a quarter, in poster space
const ORDER = ['U9', 'U8', 'U7', 'U6', 'U3', 'U1', 'U2', 'U4'];          // band groups: bass first
const COLOR = { U1:'#7dad4c', U2:'#da421e', U3:'#007a5b', U4:'#f0d722', U5:'#7e5330', U6:'#8c6dab', U7:'#528dba', U8:'#224f86', U9:'#f3791d' };
const grpv = (arr, a, b) => { let t = 0; for (let i = a; i < b; i++) t += arr[i]; return clamp((t / (b - a)) * 1.5); };

// measure the routes with the browser's own SVG engine
const NS = 'http://www.w3.org/2000/svg', probe = document.createElementNS(NS, 'svg'); probe.setAttribute('width', 0); probe.setAttribute('height', 0); probe.style.position = 'absolute'; document.body.append(probe);
PATHS.forEach((p) => { const el = document.createElementNS(NS, 'path'); el.setAttribute('d', p.d); probe.append(el); p.el = el; p.len = el.getTotalLength(); p.p2d = new Path2D(p.d); });
const longest = {}; PATHS.forEach((p) => { if (!longest[p.line] || p.len > longest[p.line].len) longest[p.line] = p; });

const mapLight = new Image(), mapDark = new Image();
let baseLight = null, baseDark = null;
function turn(g) { g.translate(MCX, MCY); g.rotate(-Math.PI / 2); g.scale(MS, MS); g.translate(-SVGW / 2, -SVGH / 2); }
function buildBase(img) {
  const b = document.createElement('canvas'); b.width = 1200; b.height = 1600; const g = b.getContext('2d');
  g.scale(2, 2); turn(g); g.drawImage(img, 0, 0, SVGW, SVGH); return b;
}
// on the dark map the two darkest line colours would sink, so they are lifted
const COLOR_DARK = { ...COLOR, U8: '#4f86c8', U5: '#b98457', U3: '#13a37c' };

function draw(c, pal, st, o) {
  const g = c.getContext('2d');
  const dpr = devicePixelRatio || 1;
  const cw = c.clientWidth, ch = c.clientHeight;
  if (c.width !== Math.round(cw * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  const s = Math.min(c.width / W, c.height / H);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = pal.bg; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(s, 0, 0, s, (c.width - W * s) / 2, (c.height - H * s) / 2);
  const tr = TRACKS[ti];

  const k = 1 - Math.exp(-o.dt / 0.15);
  for (let i = 0; i < NB; i++) { st.b[i] += (o.bands[i] - st.b[i]) * k; st.pk[i] = Math.max(st.b[i], st.pk[i] - o.dt * 0.18); }
  const lv = {}, pk = {};
  ORDER.forEach((l, i) => { const a = Math.floor(i * NB / 8), b = Math.ceil((i + 1) * NB / 8); lv[l] = grpv(st.b, a, b); pk[l] = grpv(st.pk, a, b); });

  // ---- the map, and the coloured routes on top of it
  g.save(); if (pal.multiply) g.globalCompositeOperation = 'multiply'; g.drawImage(pal.dark ? baseDark : baseLight, 0, 0, W, H); g.restore();
  const COL = pal.dark ? COLOR_DARK : COLOR;
  g.save(); turn(g); g.translate(LAYER[0], LAYER[1]); g.lineCap = 'round'; g.lineJoin = 'round';
  PATHS.forEach((p) => {
    if (p.line === 'U5') { const e = p.len * (0.02 + 0.96 * o.played); g.strokeStyle = COL.U5; g.lineWidth = p.w; g.setLineDash([e, p.len * 2]); g.stroke(p.p2d); return; }
    const e = p.len * clamp(lv[p.line]); g.strokeStyle = COL[p.line]; g.lineWidth = p.w; g.setLineDash(p.dash ? [4, 4] : [e, p.len * 2]);
    if (p.dash) { g.save(); g.beginPath(); g.setLineDash([4, 4]); g.globalAlpha = 0.25 + 0.75 * clamp(lv[p.line]); g.stroke(p.p2d); g.restore(); } else g.stroke(p.p2d);
  });
  g.setLineDash([]);
  // a dot at each line's held peak, and the train on U5
  Object.keys(longest).forEach((l) => { if (l === 'U5') return; const p = longest[l], at = p.el.getPointAtLength(p.len * clamp(pk[l])); g.beginPath(); g.arc(at.x, at.y, 6, 0, TAU); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 3; g.strokeStyle = COL[l]; g.stroke(); });
  { const p = longest.U5, at = p.el.getPointAtLength(p.len * (0.02 + 0.96 * o.played)); g.beginPath(); g.arc(at.x, at.y, 11, 0, TAU); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 5; g.strokeStyle = COL.U5; g.stroke(); g.beginPath(); g.arc(at.x, at.y, 3.6, 0, TAU); g.fillStyle = COL.U5; g.fill(); }
  g.restore();

  if (o.text) {
    const T2 = (t, x, y, size, col, al = 'left', wt = 700, ls = 0) => { g.font = `${wt} ${size}px ${HELV}`; g.letterSpacing = `${ls}px`; g.textAlign = al; g.fillStyle = col; g.fillText(t, x, y); g.letterSpacing = '0px'; };
    const words = tr.title.split(/\s+/); let fit = null;
    for (let size = 34; size >= 16 && !fit; size--) {
      g.font = `700 ${size}px ${HELV}`; const lines = []; let cur = '';
      for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width <= 520 || !cur) cur = t; else { lines.push(cur); cur = w; } }
      lines.push(cur); if (lines.length <= 2 && lines.every((l) => g.measureText(l).width <= 520)) fit = { size, lines };
    }
    fit = fit || { size: 16, lines: [tr.title] };
    fit.lines.forEach((l, i) => T2(l, 30, 24 + fit.size * 0.9 + i * fit.size * 1.02, fit.size, pal.ink, 'left', 700, -0.6));
    const y = 24 + fit.size * 0.9 + (fit.lines.length - 1) * fit.size * 1.02 + 18;
    T2(`${tr.name}${tr.album ? ' · ' + tr.album : ''}${tr.year ? ' · ' + tr.year : ''}`.slice(0, 60), 30, y, 12, pal.mute, 'left', 500, 0.2);
    // the key: the eight lines as badges, bass first, and U5 for the time
    const keys = [...ORDER, 'U5']; keys.forEach((l, i) => { const x = 30 + i * 60; g.fillStyle = COL[l]; g.beginPath(); g.roundRect(x, 768, 26, 14, 3); g.fill(); T2(l, x + 13, 779, 10, '#fff', 'center', 700, 0); });
    T2('BASS', 30, 794, 8, pal.mute, 'left', 600, 1.5); T2('HIGHS', 30 + 7 * 60 + 26, 794, 8, pal.mute, 'right', 600, 1.5); T2(`TIME  ${mmss(o.played * tr.dur)} / ${mmss(tr.dur)}`, 570, 794, 8, pal.mute, 'right', 600, 1.5);
    T2(`${tr.codec} ${tr.bits}${tr.dr ? ' · ' + tr.dr : ''}`, 570, 24 + 12, 12, pal.mute, 'right', 500, 0.2);
  }
}

const cards = PALS.map(([label, pal]) => {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  f.append(c, cap);
  $('grid').append(f);
  return { c, pal, st: { b: new Array(NB).fill(0), pk: new Array(NB).fill(0) } };
});

let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now; clock += dt;
  const auto = $('auto').checked;
  const bands = fakeBands(clock, auto ? 1.15 : +$('lvl').value * 2);
  const o = { dt, clock, bands, played: (clock % 40) / 40, text: $('text').checked };
  cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o));
  requestAnimationFrame(frame);
}
$('next').onclick = () => { ti = (ti + 1) % TRACKS.length; };
let loaded = 0;
const ready = () => {
  if (++loaded < 2) return;
  baseLight = buildBase(mapLight); baseDark = buildBase(mapDark);
  for (let i = 0; i < 40; i++) { clock += 0.05; const o = { dt: 0.05, clock, bands: fakeBands(clock, 1.15), played: (clock % 40) / 40, text: true }; cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o)); }
  last = performance.now(); requestAnimationFrame(frame);
};
mapLight.onload = ready; mapDark.onload = ready;
mapLight.src = 'berlin-ubahn.svg'; mapDark.src = 'berlin-ubahn-dark.svg';
</script>
