<!doctype html>
<meta charset="utf-8">
<title>Magnetite Poster: Spectrum</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Mockup of a Spectrum poster meter, in the manner of a colour-palette poster of vertical bars (own layout, nothing copied; the
   reference used a space agency's colours and logo, which are left out): eight tall colour bars side by side, a barcode and a hex
   string, a heavy title, a list of the colours, a short stripe of four. Meters: the eight bars are eight band groups (bass on the
   left) and their heights follow the levels (slowly), so the paper shows above the quiet ones; each colour moves a little towards
   a lighter one with its level, and the hex codes in the list, in the string and in the barcode are the colours right now (the
   barcode is redrawn once a second). The short stripe of four colours is the time played. Fake signal, no audio. */
:root { --bg:#121212; --fg:#d8d8d8; --muted:#8a8a8a; --mono: ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 20px var(--mono); margin: 0; }
p { margin: 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font: 13px var(--mono); background: #242424; color: var(--fg); border: 1px solid #444; padding: 6px 10px; cursor: pointer; }
label { font: 13px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 6px; }
figcaption { font: 12px/1.45 var(--mono); color: var(--muted); }
canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border: 1px solid #333; }
</style>
<div class="wrap">
  <h1>Poster: Spectrum</h1>
  <p>A palette poster of eight vertical bars as a meter: each bar is a band group (bass on the left) whose height follows its level slowly and over a limited range, the hex codes and the barcode are the colours right now, and the short stripe of four colours is the time played.</p>
  <div class="bar">
    <button id="next">next track</button>
    <label><input id="text" type="checkbox" checked> text</label>
    <label><input id="auto" type="checkbox" checked> auto level</label>
    <label>level <input id="lvl" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const W = 600, H = 800, TAU = Math.PI * 2;
const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const MONO = 'ui-monospace, Menlo, Consolas, monospace';
const PALS = [
  ['70s', { paper:'#fdf5e2', ink:'#1a1a1a', mute:'#cfc9b8', bars:['#f4f4f4', '#b6b6b6', '#fc3d21', '#d1480f', '#a2673f', '#1d7373', '#005288', '#1a1a1a'] }],
  ['Soft', { paper:'#fbf3ec', ink:'#2b2540', mute:'#ddd0c8', bars:['#fbeee8', '#f3d3d3', '#f0a6a6', '#e57a8b', '#c585a6', '#8f7fb8', '#5f6fa8', '#2b2540'] }],
  ['Dusk', { paper:'#f6efdf', ink:'#1b2a30', mute:'#d6ccb8', bars:['#f3ead7', '#cfc5ab', '#f1a35c', '#e0662f', '#b24a3a', '#5a6b6f', '#2f4a57', '#1b2a30'] }],
];
const TT = { black:'#000', green:'#2bff4a', yellow:'#ffee2e', red:'#ff3b2e', cyan:'#2ee6ff', white:'#f4f4f4', blue:'#1a2cff' };
const TRACKS = [
  { name:'Ana Duarte', title:'Maré Cheia', album:'Ilhas', year:'2024', codec:'FLAC', bits:'24/96', dr:'DR12', dur:274, n:3, of:12 },
  { name:'Night Ferry', title:'Eleven Miles of Fog and Static', album:'Long Crossings, Vol. 2', year:'1998', codec:'ALAC', bits:'16/44', dr:'DR7', dur:468, n:11, of:14 },
  { name:'Mono', title:'Tape 3', album:'', year:'', codec:'MP3', bits:'320', dr:'', dur:125, n:1, of:1 },
];
let ti = 0;
const $ = (id) => document.getElementById(id);
const NB = 30;
const clamp = (v) => Math.max(0, Math.min(1, v));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function fakeBands(t, base) {
  return Array.from({ length: NB }, (_, i) => {
    const tilt = 1 - i / (NB * 1.7);
    const v = 0.42 + 0.24 * Math.sin(t * (0.9 + i * 0.21) + i) + 0.4 * Math.pow(Math.max(0, Math.sin(t * (3.1 - i * 0.08) + i * 0.9)), 6);
    return clamp(v * tilt * base);
  });
}

// ---- small drawing helpers
function path(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function plen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return d; }
function at(p, d) {
  for (let i = 1; i < p.length; i++) {
    const l = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= l) { const k = d / l; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * k, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * k]; }
    d -= l;
  }
  return p[p.length - 1];
}
function quad(a, c, b, n = 18) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; }); }
function arrow(g, p, fill, size = 9) {
  const [x, y] = p[p.length - 1], [px, py] = p[p.length - 2], a = Math.atan2(y - py, x - px);
  g.beginPath(); g.moveTo(x + 2 * Math.cos(a), y + 2 * Math.sin(a));
  g.lineTo(x - size * Math.cos(a - 0.42), y - size * Math.sin(a - 0.42));
  g.lineTo(x - size * Math.cos(a + 0.42), y - size * Math.sin(a + 0.42)); g.closePath();
  g.save(); g.fillStyle = fill; g.fill(); g.restore(); g.stroke();
}
function T(g, s, x, y, o) {
  g.font = `${o.weight || 400} ${o.size || 10.5}px ${o.font || SANS}`;
  g.letterSpacing = `${o.ls ?? 1.3}px`;
  g.textAlign = o.align || 'left'; g.fillStyle = o.color;
  g.fillText(s, x, y); g.letterSpacing = '0px';
}
function box3(g, x, y, w, h, dx, dy, bg) {
  g.save(); g.fillStyle = bg;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w, y); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w + dx, y + h + dy); g.lineTo(x + w, y + h); g.closePath(); g.fill(); g.stroke();
  g.fillRect(x, y, w, h); g.strokeRect(x, y, w, h); g.restore();
}
function cyl(g, cx, cy, rx, ry, h, amt, pal) {
  const bot = cy + h;
  g.beginPath(); g.moveTo(cx - rx, cy); g.lineTo(cx - rx, bot); g.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true);
  g.lineTo(cx + rx, cy); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI, true); g.closePath();
  g.save(); g.fillStyle = pal.bg; g.fill(); g.clip();
  g.globalAlpha = 0.85; g.fillStyle = pal.acc; g.fillRect(cx - rx - 2, bot + ry - amt * (h + ry), rx * 2 + 4, h + ry * 2);
  g.restore(); g.stroke();
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.save(); g.fillStyle = pal.bg; g.fill(); g.restore(); g.stroke();
}


const HELV = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const NAMES = ['SUB', 'BASS', 'LOW MID', 'MID', 'UPPER MID', 'PRESENCE', 'BRILLIANCE', 'AIR'];
const grpv = (arr, a, b) => { let t = 0; for (let i = a; i < b; i++) t += arr[i]; return clamp((t / (b - a)) * 1.5); };
const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (c) => c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

function draw(c, pal, st, o) {
  const g = c.getContext('2d');
  const dpr = devicePixelRatio || 1, cw = c.clientWidth, ch = c.clientHeight;
  if (c.width !== Math.round(cw * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  const s = Math.min(c.width / W, c.height / H);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = pal.paper; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(s, 0, 0, s, (c.width - W * s) / 2, (c.height - H * s) / 2);
  const tr = TRACKS[ti];

  const k = 1 - Math.exp(-o.dt / 0.6);
  for (let i = 0; i < NB; i++) st.b[i] += (o.bands[i] - st.b[i]) * k;
  const lv = Array.from({ length: 8 }, (_, i) => clamp(grpv(st.b, Math.floor(i * NB / 8), Math.ceil((i + 1) * NB / 8))));

  // ---- the eight bars: heights follow the levels, colours move a little towards lighter
  const X0 = 28, BW = 68, YB = 640, HMIN = 300, HMAX = 530, cols = [];
  lv.forEach((v, i) => {
    const col = mixc(rgb(pal.bars[i]), [255, 255, 255], v * 0.07), hgt = HMIN + (HMAX - HMIN) * v;
    cols.push(toHex(col)); g.fillStyle = `rgb(${col.map(Math.round).join(',')})`; g.fillRect(X0 + i * BW, YB - hgt, BW, hgt);
  });
  const hexStr = cols.join(',');

  // ---- the barcode, redrawn once a second from the hex string
  st.bcT = (st.bcT || 0) + o.dt;
  if (!st.bc || st.bcT > 1.0) { st.bcT = 0; let sd = 7; for (const ch2 of hexStr) sd = (sd * 31 + ch2.charCodeAt(0)) | 0; const bars = []; let x = 0, on = true; while (x < 362) { sd = (sd * 1103515245 + 12345) & 0x7fffffff; const w = 1 + Math.floor((sd / 0x7fffffff) * 3); if (on) bars.push([x, Math.min(w, 362 - x)]); x += w + 1; on = !on || true; } st.bc = bars; }
  g.fillStyle = pal.ink; st.bc.forEach(([x, w]) => g.fillRect(28 + x, 38, w, 38));
  const T2 = (t, x, y, size, col, al = 'left', wt = 700, ls = 0, cond = false) => { g.font = `${wt} ${size}px ${cond ? '"Helvetica Neue Condensed", "Arial Narrow", ' + HELV : HELV}`; g.letterSpacing = `${ls}px`; g.textAlign = al; g.fillStyle = col; g.fillText(t, x, y); g.letterSpacing = '0px'; };
  T2(hexStr, 28, 88, 7.5, pal.ink, 'left', 500, 0, true);
  T2('MAGNETITE', 572, 78, 32, pal.ink, 'right', 900, -1.5);

  if (o.text) {
    // ---- the list of colours, left, with the live hex codes
    NAMES.forEach((nm, i) => T2(`[ ${cols[i]} ] ${nm}`, 28, 668 + i * 14.6, 10.5, pal.mute, 'left', 500, 0));
    // ---- title, subtitle, the stripe of four for the time played, the hex string again
    let size = 76; g.font = `800 ${size}px ${HELV}`; g.letterSpacing = '-3px'; while (g.measureText(tr.title).width > 350 && size > 24) { size--; g.font = `800 ${size}px ${HELV}`; } g.letterSpacing = '0px';
    T2(tr.title, 572, 716, size, pal.ink, 'right', 800, -size * 0.04);
    T2(`recording by ${tr.name}${tr.album ? ' · ' + tr.album : ''}${tr.year ? ' · ' + tr.year : ''}`, 572, 742, 14, pal.ink, 'right', 500, 0);
    const SX = 392, SW = 180, seg = [rgb(pal.bars[2]), rgb(pal.bars[3]), rgb(pal.bars[5]), rgb(pal.bars[6])];
    g.save(); g.globalAlpha = 0.25; seg.forEach((c2, i) => { g.fillStyle = `rgb(${c2.join(',')})`; g.fillRect(SX + i * SW / 4, 752, SW / 4, 6); }); g.restore();
    seg.forEach((c2, i) => { const f = clamp(o.played * 4 - i); g.fillStyle = `rgb(${c2.join(',')})`; g.fillRect(SX + i * SW / 4, 752, SW / 4 * f, 6); });
    T2(`${tr.codec} ${tr.bits}${tr.dr ? ' · ' + tr.dr : ''} · ${mmss(o.played * tr.dur)} / ${mmss(tr.dur)}`, 572, 780, 13, pal.ink, 'right', 600, 0);
  }
}

const cards = PALS.map(([label, pal]) => {
  const f = document.createElement('figure'); const c = document.createElement('canvas'); const cap = document.createElement('figcaption');
  cap.textContent = label; f.append(c, cap); $('grid').append(f);
  return { c, pal, st: { b: new Array(NB).fill(0) } };
});
let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
  const auto = $('auto').checked;
  const o = { dt, clock, bands: fakeBands(clock, auto ? 1.15 : +$('lvl').value * 2), played: (clock % 40) / 40, text: $('text').checked };
  cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o));
  requestAnimationFrame(frame);
}
$('next').onclick = () => { ti = (ti + 1) % TRACKS.length; };
for (let i = 0; i < 40; i++) { clock += 0.05; const o = { dt: 0.05, clock, bands: fakeBands(clock, 1.15), played: (clock % 40) / 40, text: true }; cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o)); }
last = performance.now(); requestAnimationFrame(frame);
</script>
