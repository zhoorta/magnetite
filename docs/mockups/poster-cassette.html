<!doctype html>
<meta charset="utf-8">
<title>Magnetite Poster: Cassette</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Mockup of a Cassette poster meter: sheet 1 of US patent 4,654,740 (Magnetic Tape Cassette, 1987; a US patent drawing, in the
   public domain as a government document: check this on the patent's page before it is built into the app). The drawing is cleaned
   to white lines on transparency (the PNG below is that, cropped to the figure, 61 KB) on a flat ground.
   Meters: the lines of the three layers glow in the accent colour (with a halo, and the glow copy shakes a few pixels) with three band groups (top shell the highs, the reel layer the
   mids, bottom shell the bass); the reels turn (the hubs' holes rotate) and the tape packs move from the left reel to the right
   as the track plays, drawn as rings on the drawing's own reels; the patent's header carries the track. Fake signal, no audio. */
:root { --bg:#121212; --fg:#d8d8d8; --muted:#8a8a8a; --mono: ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 20px var(--mono); margin: 0; }
p { margin: 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font: 13px var(--mono); background: #242424; color: var(--fg); border: 1px solid #444; padding: 6px 10px; cursor: pointer; }
label { font: 13px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 6px; }
figcaption { font: 12px/1.45 var(--mono); color: var(--muted); }
canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border: 1px solid #333; }
</style>
<div class="wrap">
  <h1>Poster: Cassette</h1>
  <p>The cassette patent drawing as a meter: the three layers of the exploded view glow and shake with the bass, mids and highs, the reels turn and the tape runs from the left reel to the right as the track plays; the header is the track.</p>
  <div class="bar">
    <button id="next">next track</button>
    <label><input id="text" type="checkbox" checked> text</label>
    <label><input id="auto" type="checkbox" checked> auto level</label>
    <label>level <input id="lvl" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>
  <div class="grid" id="grid"></div>
</div>

];

const clamp = (v) => Math.max(0, Math.min(1, v));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function fakeBands(t, base) {
  return Array.from({ length: NB }, (_, i) => {
    const tilt = 1 - i / (NB * 1.7);
    const v = 0.42 + 0.24 * Math.sin(t * (0.9 + i * 0.21) + i) + 0.4 * Math.pow(Math.max(0, Math.sin(t * (3.1 - i * 0.08) + i * 0.9)), 6);
    return clamp(v * tilt * base);
  });
}

// ---- small drawing helpers
function path(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function plen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return d; }
function at(p, d) {
  for (let i = 1; i < p.length; i++) {
    const l = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= l) { const k = d / l; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * k, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * k]; }
    d -= l;
  }
  return p[p.length - 1];
}
function quad(a, c, b, n = 18) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; }); }
function arrow(g, p, fill, size = 9) {
  const [x, y] = p[p.length - 1], [px, py] = p[p.length - 2], a = Math.atan2(y - py, x - px);
  g.beginPath(); g.moveTo(x + 2 * Math.cos(a), y + 2 * Math.sin(a));
  g.lineTo(x - size * Math.cos(a - 0.42), y - size * Math.sin(a - 0.42));
  g.lineTo(x - size * Math.cos(a + 0.42), y - size * Math.sin(a + 0.42)); g.closePath();
  g.save(); g.fillStyle = fill; g.fill(); g.restore(); g.stroke();
}
function T(g, s, x, y, o) {
  g.font = `${o.weight || 400} ${o.size || 10.5}px ${o.font || SANS}`;
  g.letterSpacing = `${o.ls ?? 1.3}px`;
  g.textAlign = o.align || 'left'; g.fillStyle = o.color;
  g.fillText(s, x, y); g.letterSpacing = '0px';
}
function box3(g, x, y, w, h, dx, dy, bg) {
  g.save(); g.fillStyle = bg;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w, y); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w + dx, y + h + dy); g.lineTo(x + w, y + h); g.closePath(); g.fill(); g.stroke();
  g.fillRect(x, y, w, h); g.strokeRect(x, y, w, h); g.restore();
}
function cyl(g, cx, cy, rx, ry, h, amt, pal) {
  const bot = cy + h;
  g.beginPath(); g.moveTo(cx - rx, cy); g.lineTo(cx - rx, bot); g.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true);
  g.lineTo(cx + rx, cy); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI, true); g.closePath();
  g.save(); g.fillStyle = pal.bg; g.fill(); g.clip();
  g.globalAlpha = 0.85; g.fillStyle = pal.acc; g.fillRect(cx - rx - 2, bot + ry - amt * (h + ry), rx * 2 + 4, h + ry * 2);
  g.restore(); g.stroke();
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.save(); g.fillStyle = pal.bg; g.fill(); g.restore(); g.stroke();
}

const AW = 886, AH = 1200, ARTW = 500, ARTX = 50, ARTY = 122, SCALE = ARTW / AW;          // where the cropped drawing sits on the poster
const grpv = (arr, a, b) => { let t = 0; for (let i = a; i < b; i++) t += arr[i]; return clamp((t / (b - a)) * 1.5); };
// regions of the drawing (150 dpi sheet coordinates) and a pixel -> poster mapping
const P = (x, y) => [ARTX + (x * 4 / 3 - 427) * SCALE, ARTY + (y * 4 / 3 - 460) * SCALE];
const REG = {
  top:    [[325, 600], [700, 350], [975, 490], [975, 545], [900, 560], [690, 690], [640, 700], [590, 745], [335, 640]],
  middle: [[400, 640], [820, 620], [960, 720], [960, 800], [700, 900], [600, 960], [470, 1030], [410, 980], [440, 740]],
  bottom: [[345, 1050], [470, 1010], [690, 960], [800, 1010], [940, 960], [975, 1060], [960, 1200], [760, 1230], [590, 1225], [345, 1110]],
};
// the reels on the drawing: hub centre, and the radii of a full tape pack as an ellipse
const REELS = [{ c: [545, 793], rx: 78, ry: 34, rot: -0.1 }, { c: [718, 693], rx: 114, ry: 49, rot: -0.1 }];

const artImg = new Image();
function tint(color) { const c = document.createElement('canvas'); c.width = AW; c.height = AH; const g = c.getContext('2d'); g.drawImage(artImg, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, AW, AH); return c; }
function chalkBoard(pal) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 1600; const g = c.getContext('2d');
  g.fillStyle = pal.bg; g.fillRect(0, 0, 1200, 1600);
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.lineCap = 'round';
  for (let i = 0; i < 360; i++) { g.strokeStyle = `rgba(255,255,255,${0.012 + rnd() * 0.022})`; g.lineWidth = 14 + rnd() * 50; const x = rnd() * 1200, y = rnd() * 1600, a = -0.5 + rnd() * 0.3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * (120 + rnd() * 260), y + Math.sin(a) * (120 + rnd() * 260)); g.stroke(); }
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.07})`; g.fillRect(rnd() * 1200, rnd() * 1600, 1 + rnd() * 2, 1 + rnd() * 2); }
  const v = g.createRadialGradient(600, 800, 300, 600, 800, 1000); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.35)'); g.fillStyle = v; g.fillRect(0, 0, 1200, 1600);
  return c;
}
const layers = new Map();
function ensure(pal) {
  if (!layers.has(pal)) layers.set(pal, { line: tint(pal.line), acc: tint(pal.acc), board: null });
  return layers.get(pal);
}

function draw(c, pal, st, o) {
  const g = c.getContext('2d');
  const dpr = devicePixelRatio || 1;
  const cw = c.clientWidth, ch = c.clientHeight;
  if (c.width !== Math.round(cw * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  const s = Math.min(c.width / W, c.height / H), L = ensure(pal);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = pal.bg; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(s, 0, 0, s, (c.width - W * s) / 2, (c.height - H * s) / 2);
    const tr = TRACKS[ti];

  const k = 1 - Math.exp(-o.dt / 0.15);
  for (let i = 0; i < NB; i++) st.b[i] += (o.bands[i] - st.b[i]) * k;
  const lv = { top: grpv(st.b, 20, 30), middle: grpv(st.b, 8, 20), bottom: grpv(st.b, 0, 8) };
  st.spin += o.dt * (3 + 9 * lv.middle);

  // ---- the drawing, then each layer's lines again in the accent colour, as strong as its band group
  g.save(); g.globalAlpha = pal.chalk ? 0.94 : 1; g.drawImage(L.line, ARTX, ARTY, ARTW, AH * SCALE); g.restore();
  const SHIFT = { top: [0, -1], middle: [1, 0], bottom: [0, 1] };
  for (const key of ['top', 'middle', 'bottom']) {
    const v = clamp(lv[key] * 1.5), dx = SHIFT[key][0] * v * 5, dy = SHIFT[key][1] * v * 5;
    g.save(); g.beginPath(); REG[key].forEach(([x, y], i) => { const [px, py] = P(x, y); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.closePath(); g.clip();
    g.shadowColor = pal.acc; g.shadowBlur = 3 + v * 14; g.globalAlpha = clamp(0.12 + v * 1.1); g.drawImage(L.acc, ARTX + dx, ARTY + dy, ARTW, AH * SCALE); g.restore();
  }

  // ---- reels: tape pack rings (left shrinks, right grows with the time played) and the turning hub holes
  REELS.forEach((r, ri) => {
    const [cx, cy] = P(r.c[0], r.c[1]), frac = ri === 0 ? 1 - o.played : o.played, k2 = (0.42 + 0.58 * frac) * (1 + 0.05 * lv.middle), rx = r.rx * 4 / 3 * SCALE, ry = r.ry * 4 / 3 * SCALE;
    g.save(); g.translate(cx, cy + ry * 0.05); g.rotate(r.rot);
    g.strokeStyle = pal.acc; g.lineWidth = 1.6;
    for (let j = 0; j < 4; j++) { const f = k2 * (1 - j * 0.07); g.globalAlpha = 0.9 - j * 0.15; g.beginPath(); g.ellipse(0, 0, rx * f, ry * f, 0, 0, TAU); g.stroke(); }
    g.globalAlpha = 1; g.fillStyle = pal.acc;
    for (let j = 0; j < 7; j++) { const a = st.spin * (ri ? 0.8 : 1.15) + j * TAU / 7; g.beginPath(); g.ellipse(Math.cos(a) * rx * 0.15, Math.sin(a) * ry * 0.15, 2.2, 1.2, 0, 0, TAU); g.fill(); }
    g.restore();
  });

  if (o.text) {
    const ink = pal.line, T2 = (t, x, y, size, al = 'left', wt = 400, st2 = 'normal') => { g.font = `${st2} ${wt} ${size}px ${SERIF}`; g.textAlign = al; g.fillStyle = ink; g.fillText(t, x, y); };
    let nz = 26; g.font = `700 ${nz}px ${SERIF}`; while (g.measureText(tr.name).width > 190 && nz > 12) { nz--; g.font = `700 ${nz}px ${SERIF}`; }
    T2(tr.name, 30, 42, nz, 'left', 700); T2(tr.year || '', 238, 42, 17); T2(`Track ${tr.n} of ${tr.of}`, 332, 42, 17); T2(`${tr.codec} ${tr.bits}`, 574, 42, 24, 'right', 700);
    let tz = 38; g.font = `400 ${tz}px ${SERIF}`; const ttl = tr.title.toUpperCase(); while (g.measureText(ttl).width > 540 && tz > 14) { tz--; g.font = `400 ${tz}px ${SERIF}`; }
    T2(ttl, 300, 98, tz, 'center');
    T2(`FIG. ${tr.n}`, 156, 150, 34, 'left', 400, 'italic');
    T2(`${mmss(o.played * tr.dur)} / ${mmss(tr.dur)}`, 30, 786, 16);
    T2(`${tr.dr || ''}  ·  ${tr.album || ''}`.replace(/^ {2}· /, ''), 574, 786, 16, 'right');
  }
}

const cards = PALS.map(([label, pal]) => {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  f.append(c, cap);
  $('grid').append(f);
  return { c, pal, st: { b: new Array(NB).fill(0), spin: 0 } };
});

let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now; clock += dt;
  const auto = $('auto').checked;
  const o = { dt, clock, bands: fakeBands(clock, auto ? 1.15 : +$('lvl').value * 2), played: (clock % 40) / 40, text: $('text').checked };
  cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o));
  requestAnimationFrame(frame);
}
$('next').onclick = () => { ti = (ti + 1) % TRACKS.length; };
artImg.onload = () => {
  for (let i = 0; i < 40; i++) { clock += 0.05; const o = { dt: 0.05, clock, bands: fakeBands(clock, 1.15), played: (clock % 40) / 40, text: true }; cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o)); }
