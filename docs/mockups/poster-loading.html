<!doctype html>
<meta charset="utf-8">
<title>Magnetite Poster: Loading</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Mockup of a "Loading" poster meter: a home-computer tape loading screen of the early 1980s, in a portrait 240 x 320 pixel grid
   (each pixel is 2.5 px, drawn crisp), with the 8 colours of that machine, a striped loading border, a curved line pattern at the top,
   a big extruded block title, a red "please wait" box and chunky bitmap text. An original layout: the idea is borrowed, no
   artwork, name or credits are taken from any game.
   Meters: the title's letters are the meter: the depth of each letter's extrusion follows one of ten band groups (so the title
   breathes like an equaliser), and its face flashes white on a strong beat; the box holds the artist and a loading bar that is the
   track's position. No LED-style meters. Fake signal, no audio. The bitmap text is made from system fonts here; the real meter
   would embed its own pixel font. */
:root { --bg:#121212; --fg:#d8d8d8; --muted:#8a8a8a; --mono: ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 20px var(--mono); margin: 0; }
p { margin: 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font: 13px var(--mono); background: #242424; color: var(--fg); border: 1px solid #444; padding: 6px 10px; cursor: pointer; }
label { font: 13px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 6px; }
figcaption { font: 12px/1.45 var(--mono); color: var(--muted); }
canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border: 1px solid #333; image-rendering: pixelated; }
</style>
<div class="wrap">
  <h1>Poster: Loading</h1>
  <p>A tape loading screen as a meter: the bulky extruded title breathes with ten band groups (each letter's depth), and a "please wait" box has a loading bar for the position.</p>
  <div class="bar">
    <button id="next">next track</button>
    <label><input id="text" type="checkbox" checked> text</label>
    <label><input id="auto" type="checkbox" checked> auto level</label>
    <label>level <input id="lvl" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const W = 600, H = 800, P = 2.5, LW = 240, LH = 320, B = 12, PW = 216, PH = 296;   // logical pixels, border, paper
const C = { black:'#000000', blue:'#0000d8', red:'#d80000', magenta:'#d800d8', green:'#00d800', cyan:'#00d8d8', yellow:'#d8d800', white:'#d8d8d8' };
const PALS = [
  ['Blue paper', { border:C.black, paper:C.blue, face:C.yellow, sideA:C.red, sideB:C.magenta, fan:C.green, fanHi:C.yellow, sub:C.cyan, c:C.yellow, box:C.red, boxText:C.white }],
  ['Black paper', { border:C.blue, paper:C.black, face:C.cyan, sideA:C.blue, sideB:C.magenta, fan:C.green, fanHi:C.white, sub:C.yellow, c:C.cyan, box:C.blue, boxText:C.white }],
  ['Red paper', { border:C.black, paper:C.red, face:C.white, sideA:C.blue, sideB:C.black, fan:C.yellow, fanHi:C.white, sub:C.cyan, c:C.yellow, box:C.black, boxText:C.yellow }],
];
const TRACKS = [
  { name:'Ana Duarte', title:'Maré Cheia', album:'Ilhas', year:'2024', codec:'FLAC', bits:'24/96', dr:'DR12', dur:274, n:3, of:12 },
  { name:'Night Ferry', title:'Eleven Miles of Fog and Static', album:'Long Crossings, Vol. 2', year:'1998', codec:'ALAC', bits:'16/44', dr:'DR7', dur:468, n:11, of:14 },
  { name:'Mono', title:'Tape 3', album:'', year:'', codec:'MP3', bits:'320', dr:'', dur:125, n:1, of:1 },
];
let ti = 0;
const $ = (id) => document.getElementById(id);
const NB = 30;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const avg = (a, i, j) => { let s = 0; for (let k = i; k < j; k++) s += a[k]; return s / (j - i); };
const TXT = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
function fakeBands(t, base) {
  return Array.from({ length: NB }, (_, i) => {
    const tilt = 1 - i / (NB * 1.7);
    const v = 0.42 + 0.24 * Math.sin(t * (0.9 + i * 0.21) + i) + 0.4 * Math.pow(Math.max(0, Math.sin(t * (3.1 - i * 0.08) + i * 0.9)), 6);
    return clamp(v * tilt * base);
  });
}

// ---- bitmap text: a string is drawn once on a small canvas and thresholded to pixels
const BMC = document.createElement('canvas').getContext('2d', { willReadFrequently: true }), BM = new Map();
function bm(str, font, size) {
  const key = font + '|' + str;
  if (BM.has(key)) return BM.get(key);
  BMC.canvas.width = 4; BMC.font = font;
  const w = Math.ceil(BMC.measureText(str).width) + 4, h = Math.ceil(size * 1.5) + 2;
  BMC.canvas.width = w; BMC.canvas.height = h; BMC.font = font; BMC.fillStyle = '#000'; BMC.textBaseline = 'alphabetic';
  BMC.fillText(str, 2, size);
  const d = BMC.getImageData(0, 0, w, h).data, px = [], set = new Set();
  let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] >= 110) { px.push([x, y]); set.add(y * w + x); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const r = { w, px, set, x0: x0 > x1 ? 0 : x0, x1: Math.max(x1, 0), y0: y0 > y1 ? 0 : y0, y1: Math.max(y1, 0) };
  r.width = r.x1 - r.x0 + 1; r.height = r.y1 - r.y0 + 1;
  BM.set(key, r); return r;
}
const SMALL = '700 8px "Courier New", Courier, monospace';
const BIG = (sz) => `900 ${sz}px "Arial Black", Impact, "Helvetica Neue", Arial, sans-serif`;
function ptext(g, str, x, y, color, align = 'left') {      // small bitmap text; x,y = top-left (or centre/right edge) in logical pixels
  const b = bm(TXT(str), SMALL, 8), ox = align === 'center' ? Math.round(x - b.width / 2) : align === 'right' ? x - b.width : x;
  g.beginPath(); for (const [px, py] of b.px) g.rect(ox + px - b.x0, y + py - b.y0, 1, 1);
  g.fillStyle = color; g.fill();
}
const LAY = new Map();
function layout(title) {
  if (LAY.has(title)) return LAY.get(title);
  const words = TXT(title).split(/\s+/);
  let res = null;
  outer: for (const sz of [24, 20, 17, 14, 12, 10]) for (const s of [3, 2, 1]) {
    const lim = Math.floor(206 / s), lines = []; let cur = '', ok = true;
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (bm(t, BIG(sz), sz).width <= lim) cur = t;
      else { if (!cur) { ok = false; break; } lines.push(cur); cur = w; if (bm(cur, BIG(sz), sz).width > lim) { ok = false; break; } }
    }
    if (!ok) continue; lines.push(cur);
    const hh = lines.reduce((a, l) => a + bm(l, BIG(sz), sz).height * s + s * 3, 0);
    if (lines.length <= 3 && hh <= 150) { res = { lines, sz, s }; break outer; }
  }
  res = res || { lines: [TXT(title).slice(0, 12)], sz: 10, s: 1 };
  LAY.set(title, res); return res;
}

const states = new WeakMap();
function stateOf(c) {
  if (!states.has(c)) states.set(c, { prev: null, slow: 0.3, last: -9, beats: 0, frame: -1, stripes: [], L: 0, R: 0 });
  return states.get(c);
}
function line(path, x0, y0, x1, y1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) path.rect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1);
}
function seeded(n) { let s = (n * 2654435761) % 2147483647 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function poster(g, t, pal, tr, o) {
  const st = stateOf(g.canvas), dt = st.prev === null ? 0.016 : clamp(t - st.prev, 0.001, 0.05); st.prev = t;
  const base = o.auto ? 0.55 + 0.25 * Math.sin(t * 0.35) : o.lvl * 1.4;
  const bands = fakeBands(t, base), el = t % tr.dur, prog = el / tr.dur;
  const bass = avg(bands, 0, 4), lvl = avg(bands, 0, NB);
  st.slow += (bass - st.slow) * Math.min(1, dt * 1.4);
  if (bass > st.slow * 1.22 + 0.04 && t - st.last > 0.42) { st.last = t; st.beats++; }
  st.L = clamp(avg(bands, 0, 14) * 1.5 + 0.08 * Math.sin(t * 5.3)); st.R = clamp(avg(bands, 0, 14) * 1.5 + 0.08 * Math.sin(t * 4.1 + 1));

  g.save(); g.scale(P, P); g.imageSmoothingEnabled = false;
  g.fillStyle = pal.border; g.fillRect(0, 0, LW, LH);
  g.fillStyle = pal.paper; g.fillRect(B, B, PW, PH);
  g.save(); g.translate(B, B); g.beginPath(); g.rect(0, 0, PW, PH); g.clip();

  if (o.text) {
    // heading between the fans
    const lg = bm('MAGNETITE', BIG(15), 15), lx = Math.round(PW / 2 - lg.width / 2) - lg.x0, ly = 6 - lg.y0;
    g.beginPath(); for (const [x, y] of lg.px) g.rect(lx + x, ly + y, 1, 1); g.fillStyle = C.white; g.fill();
    ptext(g, 'NOW PLAYING', PW / 2, 27, pal.sub, 'center');
    ptext(g, `(C) ${tr.year || 'SINGLE'}`, PW / 2, 38, pal.c, 'center');

    // title: extruded blocks (left sides, undersides, then the faces); the depth of each letter follows a band group
    const { lines, sz, s } = layout(tr.title), Emax = Math.ceil(s * 2.6);
    const lh = lines.map((l) => bm(l, BIG(sz), sz).height * s + Emax + 2);
    let y = 56 + Math.max(0, (150 - lh.reduce((a, b) => a + b, 0)) / 2);
    const flash = t - st.last < 0.12 && bass > 0.5;
    lines.forEach((l, li) => {
      const b = bm(l, BIG(sz), sz), x0 = Math.round(PW / 2 - (b.width * s) / 2) + Math.floor(Emax / 2), sides = new Path2D(), under = new Path2D(), faces = new Path2D();
      for (const [px, py] of b.px) {
        const gi = Math.min(9, Math.floor((px - b.x0) / b.width * 10)), E = Math.max(1, Math.round(s * 0.8 + clamp(avg(bands, gi * 3, gi * 3 + 3) * 1.7) * s * 1.8));
        const X = x0 + (px - b.x0) * s, Y = Math.round(y) + (py - b.y0) * s;
        if (!b.set.has(py * b.w + px - 1)) { sides.moveTo(X, Y); sides.lineTo(X, Y + s); sides.lineTo(X - E, Y + s + E); sides.lineTo(X - E, Y + E); sides.closePath(); }
        if (!b.set.has((py + 1) * b.w + px)) { under.moveTo(X, Y + s); under.lineTo(X + s, Y + s); under.lineTo(X + s - E, Y + s + E); under.lineTo(X - E, Y + s + E); under.closePath(); }
        faces.rect(X, Y, s, s);
      }
      g.fillStyle = pal.sideB; g.fill(under); g.fillStyle = pal.sideA; g.fill(sides); g.fillStyle = flash ? C.white : pal.face; g.fill(faces);
      y += lh[li];
    });

    // box: artist and loading bar
    g.fillStyle = pal.box; g.fillRect(24, 226, 168, 24);
    ptext(g, tr.name.length > 24 ? tr.name.slice(0, 23) + '.' : tr.name, 108, 230, pal.boxText, 'center');
    const n = 24, on = Math.round(prog * n);
    g.fillStyle = pal.boxText; for (let i = 0; i < n; i++) { if (i < on) g.fillRect(28 + i * 6.8 | 0, 241, 5, 5); else g.fillRect((28 + i * 6.8) | 0, 244, 5, 1); }
    // file lines
    ptext(g, [tr.album || 'SINGLE', tr.year].filter(Boolean).join(' - '), 24, 256, pal.sub);
    ptext(g, [tr.codec, tr.bits, tr.dr].filter(Boolean).join(' '), 24, 267, pal.c);
    ptext(g, `${mmss(el)} / ${mmss(tr.dur)}`, 24, 278, C.white);
    ptext(g, `TRACK ${String(tr.n).padStart(2, '0')}/${String(tr.of).padStart(2, '0')}`, 192, 278, C.white, 'right');
  }

  g.restore(); g.restore();
}

// ---- page
const grid = $('grid'), cards = [];
PALS.forEach(([name, pal]) => {
  const fig = document.createElement('figure'), c = document.createElement('canvas');
  c.width = W * 2; c.height = H * 2;
  const cap = document.createElement('figcaption'); cap.textContent = name;
  fig.append(c, cap); grid.append(fig);
  cards.push({ g: c.getContext('2d'), pal });
});
$('next').onclick = () => { ti = (ti + 1) % TRACKS.length; };
let T0 = 0;
function frame(ms) {
  const t = (ms + T0) / 1000;
  const o = { text: $('text').checked, auto: $('auto').checked, lvl: +$('lvl').value };
  for (const { g, pal } of cards) { g.save(); g.scale(2, 2); poster(g, t, pal, TRACKS[ti], o); g.restore(); }
  requestAnimationFrame(frame);
}
// ?warm=N starts the animation N seconds in (for screenshots)
T0 = (+new URLSearchParams(location.search).get('warm') || 0) * 1000;
requestAnimationFrame(frame);
</script>
