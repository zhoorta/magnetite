<!doctype html>
<meta charset="utf-8">
<title>Magnetite Poster: Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Mockup of a Lens poster meter, in the manner of a flat black drawing of a manual camera lens with white engraved scales (own
   drawing of a generic lens, nothing traced). Rings: the two knurled grip rings are the spectrum, 60 ridges each, one band per
   ridge (bass on the left), the upper ring weighted by the left channel and the lower one by the right. Aperture scale: its
   stops light from the open end towards the closed end with the loudness, and an index follows. Depth-of-field fan: the left
   and right sides light from the middle outwards with the left and right level. Distance window: the focus index slides from
   infinity to the near end with the time played. The round button lights on bass onsets, the other with the peak; the front
   ring is engraved with the title and the format. Fake signal, no audio. */
:root { --bg:#121212; --fg:#d8d8d8; --muted:#8a8a8a; --mono: ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 20px var(--mono); margin: 0; }
p { margin: 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font: 13px var(--mono); background: #242424; color: var(--fg); border: 1px solid #444; padding: 6px 10px; cursor: pointer; }
label { font: 13px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 6px; }
figcaption { font: 12px/1.45 var(--mono); color: var(--muted); }
canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border: 1px solid #333; }
</style>
<div class="wrap">
  <h1>Poster: Lens</h1>
  <p>A manual lens as a meter: the two knurled rings are the spectrum (60 ridges, upper ring left, lower ring right), the aperture stops light with the loudness, the depth-of-field fan shows left and right, and the focus index slides along the distance scale for the time played.</p>
  <div class="bar">
    <button id="next">next track</button>
    <label><input id="text" type="checkbox" checked> text</label>
    <label><input id="auto" type="checkbox" checked> auto level</label>
    <label>level <input id="lvl" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const W = 600, H = 800, TAU = Math.PI * 2;
const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const MONO = 'ui-monospace, Menlo, Consolas, monospace';
const PALS = [
  ['Black on white', { bg:'#ffffff', body:'#0b0b0b', line:'#ffffff', dim:'#4a4a4a', lit:'#ffffff', acc:'#ff3b1f' }],
  ['White on black', { bg:'#0a0a0a', body:'#0a0a0a', line:'#d8d8d8', dim:'#363636', lit:'#ffffff', acc:'#ff3b1f' }],
  ['Brass', { bg:'#17130e', body:'#241d15', line:'#d9b25c', dim:'#4a3d24', lit:'#ffe08a', acc:'#ff7a2a' }],
];
const TT = { black:'#000', green:'#2bff4a', yellow:'#ffee2e', red:'#ff3b2e', cyan:'#2ee6ff', white:'#f4f4f4', blue:'#1a2cff' };
const TRACKS = [
  { name:'Ana Duarte', title:'Maré Cheia', album:'Ilhas', year:'2024', codec:'FLAC', bits:'24/96', dr:'DR12', dur:274, n:3, of:12 },
  { name:'Night Ferry', title:'Eleven Miles of Fog and Static', album:'Long Crossings, Vol. 2', year:'1998', codec:'ALAC', bits:'16/44', dr:'DR7', dur:468, n:11, of:14 },
  { name:'Mono', title:'Tape 3', album:'', year:'', codec:'MP3', bits:'320', dr:'', dur:125, n:1, of:1 },
];
let ti = 0;
const $ = (id) => document.getElementById(id);
const NB = 30;
const clamp = (v) => Math.max(0, Math.min(1, v));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function fakeBands(t, base) {
  return Array.from({ length: NB }, (_, i) => {
    const tilt = 1 - i / (NB * 1.7);
    const v = 0.42 + 0.24 * Math.sin(t * (0.9 + i * 0.21) + i) + 0.4 * Math.pow(Math.max(0, Math.sin(t * (3.1 - i * 0.08) + i * 0.9)), 6);
    return clamp(v * tilt * base);
  });
}

// ---- small drawing helpers
function path(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function plen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return d; }
function at(p, d) {
  for (let i = 1; i < p.length; i++) {
    const l = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= l) { const k = d / l; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * k, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * k]; }
    d -= l;
  }
  return p[p.length - 1];
}
function quad(a, c, b, n = 18) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; }); }
function arrow(g, p, fill, size = 9) {
  const [x, y] = p[p.length - 1], [px, py] = p[p.length - 2], a = Math.atan2(y - py, x - px);
  g.beginPath(); g.moveTo(x + 2 * Math.cos(a), y + 2 * Math.sin(a));
  g.lineTo(x - size * Math.cos(a - 0.42), y - size * Math.sin(a - 0.42));
  g.lineTo(x - size * Math.cos(a + 0.42), y - size * Math.sin(a + 0.42)); g.closePath();
  g.save(); g.fillStyle = fill; g.fill(); g.restore(); g.stroke();
}
function T(g, s, x, y, o) {
  g.font = `${o.weight || 400} ${o.size || 10.5}px ${o.font || SANS}`;
  g.letterSpacing = `${o.ls ?? 1.3}px`;
  g.textAlign = o.align || 'left'; g.fillStyle = o.color;
  g.fillText(s, x, y); g.letterSpacing = '0px';
}
function box3(g, x, y, w, h, dx, dy, bg) {
  g.save(); g.fillStyle = bg;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w, y); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w + dx, y + h + dy); g.lineTo(x + w, y + h); g.closePath(); g.fill(); g.stroke();
  g.fillRect(x, y, w, h); g.strokeRect(x, y, w, h); g.restore();
}
function cyl(g, cx, cy, rx, ry, h, amt, pal) {
  const bot = cy + h;
  g.beginPath(); g.moveTo(cx - rx, cy); g.lineTo(cx - rx, bot); g.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true);
  g.lineTo(cx + rx, cy); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI, true); g.closePath();
  g.save(); g.fillStyle = pal.bg; g.fill(); g.clip();
  g.globalAlpha = 0.85; g.fillStyle = pal.acc; g.fillRect(cx - rx - 2, bot + ry - amt * (h + ry), rx * 2 + 4, h + ry * 2);
  g.restore(); g.stroke();
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.save(); g.fillStyle = pal.bg; g.fill(); g.restore(); g.stroke();
}

const HELV = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const CX = 300;
const bandAt = (arr, x) => { const i = Math.max(0, Math.min(NB - 1, Math.floor(x))), f = Math.max(0, Math.min(1, x - i)); return arr[i] * (1 - f) + arr[Math.min(NB - 1, i + 1)] * f; };
const STOPS = ['1.8', '2.8', '4', '5.6', '8', '11', '16', '22'];
const DIST = ['∞', '7', '3', '2', '1', '0,7'];

function draw(c, pal, st, o) {
  const g = c.getContext('2d');
  const dpr = devicePixelRatio || 1;
  const cw = c.clientWidth, ch = c.clientHeight;
  if (c.width !== Math.round(cw * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  const s = Math.min(c.width / W, c.height / H);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = pal.bg; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(s, 0, 0, s, (c.width - W * s) / 2, (c.height - H * s) / 2);
  const tr = TRACKS[ti];

  const k = 1 - Math.exp(-o.dt / 0.1);
  for (let i = 0; i < NB; i++) { st.b[i] += (o.bands[i] - st.b[i]) * k; st.pk[i] = Math.max(st.b[i], st.pk[i] - o.dt * 0.2); }
  const mean = st.b.reduce((a, b) => a + b, 0) / NB;
  st.lv += (mean - st.lv) * (1 - Math.exp(-o.dt / 0.3));
  st.l += (o.l - st.l) * k; st.r += (o.r - st.r) * k;
  st.cool -= o.dt; st.on = Math.max(0, st.on - o.dt * 3);
  const bass = (o.bands[0] + o.bands[1] + o.bands[2]) / 3; st.avg += (bass - st.avg) * (1 - Math.exp(-o.dt / 0.6));
  if (st.cool <= 0 && bass > st.avg * 1.3 + 0.04) { st.on = 1; st.cool = 0.2; }
  const lv = clamp(st.lv * 1.5), peak = clamp(Math.max(...st.pk) * 1.25);

  g.lineJoin = 'round'; g.lineCap = 'round';
  const body = () => { g.fillStyle = pal.body; g.strokeStyle = pal.line; g.lineWidth = 1.2; };
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  const ring = (y0, y1, hw, r = 0) => { body(); rr(CX - hw, y0, hw * 2, y1 - y0, r); g.fill(); g.stroke(); };
  const txt = (t, x, y, size, al = 'center', col = pal.line, wt = 500, ls = 0.6) => { g.font = `${wt} ${size}px ${HELV}`; g.letterSpacing = `${ls}px`; g.textAlign = al; g.fillStyle = col; g.fillText(t, x, y); g.letterSpacing = '0px'; };

  const flip = (t, x, y, size, al = 'center', col = pal.line, wt = 500, ls = 0) => { g.save(); g.translate(x, y - size * 0.36); g.rotate(Math.PI); g.font = `${wt} ${size}px ${HELV}`; g.letterSpacing = `${ls}px`; g.textAlign = al === 'left' ? 'right' : al === 'right' ? 'left' : 'center'; g.fillStyle = col; g.fillText(t, 0, size * 0.36); g.restore(); };
  // ---- the barrel: every ring touches the next, as in the drawing it follows (widths and heights are that drawing scaled to the poster)
  // one outline, drawn down the left side and mirrored for the right: the mount's plate and flange, a rounded shoulder, the rings,
  // a step out under the engraving and a long curve in to a rounded end
  const LEFT = [
    ['L', 107, 72], ['L', 100, 80], ['L', 100, 96], ['L', 94, 98], ['L', 94, 118], ['L', 70, 118],
    ['C', 34, 118, 14, 136, 14, 170], ['L', 9, 172], ['L', 9, 227], ['L', 14, 229], ['L', 14, 318], ['L', 15, 320], ['L', 15, 378],
    ['L', 26, 380], ['L', 26, 386], ['L', 19, 388], ['L', 19, 499], ['L', 26, 501], ['L', 26, 507], ['L', 24, 509], ['L', 24, 558],
    ['L', 12, 562], ['L', 8, 575], ['C', -6, 640, 2, 720, 58, 758], ['C', 96, 782, 140, 790, 190, 790],
  ];
  const mir = (x) => 600 - x;
  body(); g.beginPath(); g.moveTo(107, 60);
  LEFT.forEach(([t, ...v]) => { if (t === 'L') g.lineTo(v[0], v[1]); else g.bezierCurveTo(v[0], v[1], v[2], v[3], v[4], v[5]); });
  g.lineTo(mir(190), 790);
  for (let i = LEFT.length - 1; i >= 0; i--) { const [t, ...v] = LEFT[i]; const prev = i ? LEFT[i - 1] : ['L', 107, 60]; const px = prev[0] === 'L' ? prev[1] : prev[5], py = prev[0] === 'L' ? prev[2] : prev[6];
    if (t === 'L') g.lineTo(mir(px), py); else g.bezierCurveTo(mir(v[2]), v[3], mir(v[0]), v[1], mir(px), py); }
  g.closePath(); g.fill(); g.stroke();
  // the hairlines where one ring meets the next
  [[60 + 38, 107], [116, 94], [151, 9], [227, 14], [318, 15], [378, 26], [386, 19], [440, 22], [445, 22], [499, 26], [507, 24], [558, 24], [572, 7], [580, 6]].forEach(([y, x]) => { g.beginPath(); g.moveTo(x, y); g.lineTo(mir(x), y); g.stroke(); });
  g.beginPath(); g.moveTo(107, 72); g.lineTo(mir(107), 72); g.stroke();

  g.beginPath(); g.arc(287, 86, 9, 0, TAU); g.stroke(); g.beginPath(); g.arc(310, 86, 7, 0, TAU); g.fillStyle = lv > 0.2 ? pal.acc : pal.dim; g.globalAlpha = 0.4 + lv * 0.6; g.fill(); g.globalAlpha = 1;

  // ---- aperture ring: knurled end strips, the stops lit from the open end by the loudness, an index below
  [[12, 30], [455, 135]].forEach(([x, w]) => { const n = Math.floor(w / 3.2); for (let i = 0; i < n; i++) { g.beginPath(); g.moveTo(x + 2 + i * 3.2, 156); g.lineTo(x + 2 + i * 3.2, 222); g.globalAlpha = 0.55; g.stroke(); g.globalAlpha = 1; } });
  const SX0 = 60, SX1 = 366; flip('A', 402, 197, 15, 'center', pal.line, 600);
  STOPS.forEach((t, i) => { const x = SX0 + i * (SX1 - SX0) / 7, on = i / 7 <= lv * 1.1; flip(t, x, 196, 17, 'center', on ? pal.lit : pal.dim, 600, 0); });
  { const x = SX0 + clamp(lv * 1.1) * (SX1 - SX0); g.fillStyle = pal.acc; g.beginPath(); g.moveTo(x, 207); g.lineTo(x - 5, 217); g.lineTo(x + 5, 217); g.closePath(); g.fill(); }
  g.beginPath(); g.arc(433, 184, 14, 0, TAU); g.stroke(); g.beginPath(); g.arc(433, 184, 8, 0, TAU); g.fillStyle = st.on > 0.2 ? pal.acc : pal.dim; g.fill();

  // ---- barrel with the depth-of-field fan: left and right from the middle outwards
  g.beginPath(); g.moveTo(299, 230); g.lineTo(299, 316); g.stroke();
  const FAN = ['4', '5.6', '8', '11', '16', '22'];
  [[-1, st.l], [1, st.r]].forEach(([sd, v]) => FAN.forEach((t, i) => {
    const xn = 299 + sd * (28 + i * 34), xl = 299 + sd * (8 + i * 9), on = clamp(v * 1.15) > (i + 0.5) / 6;
    g.save(); g.strokeStyle = on ? pal.lit : pal.dim; g.lineWidth = on ? 1.6 : 1.1; g.beginPath(); g.moveTo(xn, 262); g.lineTo(xl, 292); g.lineTo(xl, 312); g.stroke(); g.restore();
    flip(t, xn, 256, 13, 'center', on ? pal.lit : pal.dim, 500, 0);
  }));
  g.beginPath(); g.arc(88, 272, 21, 0, TAU); g.stroke(); g.beginPath(); g.arc(88, 272, 13, 0, TAU); g.fillStyle = pal.acc; g.globalAlpha = 0.15 + peak * 0.85; g.fill(); g.globalAlpha = 1;

  // ---- distance window: the focus index slides from infinity to the near end with the time played
  g.beginPath(); g.moveTo(154, 322); g.lineTo(154, 376); g.moveTo(431, 322); g.lineTo(431, 376); g.stroke();
  const DX0 = 182, DX1 = 398;
  DIST.forEach((t, i) => { const x = DX0 + i * (DX1 - DX0) / 5, near = Math.abs((1 - o.played) * 5 - i) < 0.5; flip(t, x, 356, 20, 'center', near ? pal.lit : pal.line, 500, 0); });
  { const x = DX1 - o.played * (DX1 - DX0); g.fillStyle = pal.acc; g.fillRect(x - 1.2, 326, 2.4, 14); g.beginPath(); g.moveTo(x, 344); g.lineTo(x - 5, 337); g.lineTo(x + 5, 337); g.closePath(); g.fill(); }
  flip('M', 509, 364, 14, 'center', pal.line, 600, 0); flip('FT', 509, 346, 12, 'center', pal.line, 600, 0);

  // ---- the two knurled rings: 60 ridges each, one band per ridge
  const grip = (y0, y1, side) => { for (let i = 0; i < 60; i++) { const x = 28 + i * 544 / 59, v = clamp(bandAt(st.b, i / 59 * (NB - 1)) * 1.25 * (0.55 + 0.75 * side)); g.strokeStyle = v > 0.12 ? pal.lit : pal.dim; g.globalAlpha = 0.25 + 0.75 * v; g.lineWidth = 2.2; g.beginPath(); g.moveTo(x, y0 + 5); g.lineTo(x, y1 - 5); g.stroke(); } g.globalAlpha = 1; g.strokeStyle = pal.line; g.lineWidth = 1.2; };
  grip(386, 440, st.l); grip(445, 499, st.r);

  if (o.text) {
    const fitW = (str, maxW, from, to, ls) => { for (let size = from; size >= to; size--) { g.font = `600 ${size}px ${HELV}`; g.letterSpacing = `${ls}px`; const w = g.measureText(str).width; g.letterSpacing = '0px'; if (w <= maxW) return size; } return to; };
    const ring = `${tr.name.toUpperCase()}${tr.album ? '  ·  ' + tr.album.toUpperCase() : ''}${tr.year ? '  ·  ' + tr.year : ''}`;
    txt(`${tr.codec} ${tr.bits}`, CX, 544, 26, 'center', pal.line, 600, 2);
    const ttl = tr.title.toUpperCase();
    txt(ttl, CX, 650, fitW(ttl, 440, 40, 14, 2), 'center', pal.line, 600, 2);
    txt(ring, CX, 680, fitW(ring, 440, 15, 9, 2), 'center', pal.line, 500, 2);
    txt(`${mmss(o.played * tr.dur)} / ${mmss(tr.dur)}   ·   ${tr.dr || ''}   ·   ${tr.n}/${tr.of}`, CX, 716, 13, 'center', pal.line, 500, 2);
  }
}

const cards = PALS.map(([label, pal]) => {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  f.append(c, cap);
  $('grid').append(f);
  return { c, pal, st: { b: new Array(NB).fill(0), pk: new Array(NB).fill(0), lv: 0, l: 0, r: 0, avg: 0, cool: 0, on: 0 } };
});

let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now; clock += dt;
  const auto = $('auto').checked;
  const bands = fakeBands(clock, auto ? 1.15 : +$('lvl').value * 2);
  const mean = bands.reduce((a, b) => a + b, 0) / NB;
  const o = { dt, clock, bands, l: clamp(mean * (1.45 + 0.3 * Math.sin(clock * 0.7))), r: clamp(mean * (1.45 - 0.3 * Math.sin(clock * 0.7))), played: (clock % 40) / 40, text: $('text').checked };
  cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o));
  requestAnimationFrame(frame);
}
$('next').onclick = () => { ti = (ti + 1) % TRACKS.length; };
// run the first four seconds at once so the rings are already lit when the page opens
for (let i = 0; i < 80; i++) { clock += 0.05; const bands = fakeBands(clock, 1.15), mean = bands.reduce((a, b) => a + b, 0) / NB; const o = { dt: 0.05, clock, bands, l: clamp(mean * 1.45), r: clamp(mean * 1.45), played: (clock % 40) / 40, text: true }; cards.forEach((kd) => draw(kd.c, kd.pal, kd.st, o)); }
last = performance.now();
requestAnimationFrame(frame);
</script>
