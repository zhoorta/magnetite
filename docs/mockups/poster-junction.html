<!doctype html>
<meta charset="utf-8">
<title>Magnetite Poster: Junction</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Mockup of a Junction poster meter: a track-layout diagram of the railway lands behind King's Cross and St Pancras stations (a
   black line drawing, scanned; check where it comes from and its licence before it is built into the app). The drawing's black
   lines became a mask, and for every line pixel the distance along the tracks to each of the two stations was worked out
   (flood fill through the connected lines) and stored with it (the PNG below: red = distance from St Pancras, green = from King's
   Cross, blue = how black the pixel was, in steps of 8 pixels). Meters: the two stations are the two channels. Every 0.04 s the
   levels of the bass, the mids and the highs of each channel are pushed into a history, and a track pixel shows the level its
   distance ago: bass in one colour, mids in a second, highs in a third, mixed, so pulses of the music run out from the termini
   along the lines, 200 pixels a second. Fake signal, no audio. */
:root { --bg:#121212; --fg:#d8d8d8; --muted:#8a8a8a; --mono: ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 20px var(--mono); margin: 0; }
p { margin: 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { font: 13px var(--mono); background: #242424; color: var(--fg); border: 1px solid #444; padding: 6px 10px; cursor: pointer; }
label { font: 13px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 6px; }
figcaption { font: 12px/1.45 var(--mono); color: var(--muted); }
canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border: 1px solid #333; }
</style>
<div class="wrap">
  <h1>Poster: Junction</h1>
  <p>A railway track layout as a meter: the music leaves the two termini (St Pancras the left channel, King's Cross the right) and runs out along the tracks as coloured pulses, bass, mids and highs in three colours.</p>
  <div class="bar">
    <button id="next">next track</button>
    <label><input id="text" type="checkbox" checked> text</label>
    <label><input id="auto" type="checkbox" checked> auto level</label>
    <label>level <input id="lvl" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>
  <div class="grid" id="grid"></div>
</div>

const clamp = (v) => Math.max(0, Math.min(1, v));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function fakeBands(t, base) {
  return Array.from({ length: NB }, (_, i) => {
    const tilt = 1 - i / (NB * 1.7);
    const v = 0.42 + 0.24 * Math.sin(t * (0.9 + i * 0.21) + i) + 0.4 * Math.pow(Math.max(0, Math.sin(t * (3.1 - i * 0.08) + i * 0.9)), 6);
    return clamp(v * tilt * base);
  });
}

// ---- small drawing helpers
function path(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function plen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return d; }
function at(p, d) {
  for (let i = 1; i < p.length; i++) {
    const l = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (d <= l) { const k = d / l; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * k, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * k]; }
    d -= l;
  }
  return p[p.length - 1];
}
function quad(a, c, b, n = 18) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; }); }
function arrow(g, p, fill, size = 9) {
  const [x, y] = p[p.length - 1], [px, py] = p[p.length - 2], a = Math.atan2(y - py, x - px);
  g.beginPath(); g.moveTo(x + 2 * Math.cos(a), y + 2 * Math.sin(a));
  g.lineTo(x - size * Math.cos(a - 0.42), y - size * Math.sin(a - 0.42));
  g.lineTo(x - size * Math.cos(a + 0.42), y - size * Math.sin(a + 0.42)); g.closePath();
  g.save(); g.fillStyle = fill; g.fill(); g.restore(); g.stroke();
}
function T(g, s, x, y, o) {
  g.font = `${o.weight || 400} ${o.size || 10.5}px ${o.font || SANS}`;
  g.letterSpacing = `${o.ls ?? 1.3}px`;
  g.textAlign = o.align || 'left'; g.fillStyle = o.color;
  g.fillText(s, x, y); g.letterSpacing = '0px';
}
function box3(g, x, y, w, h, dx, dy, bg) {
  g.save(); g.fillStyle = bg;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w, y); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w + dx, y + h + dy); g.lineTo(x + w, y + h); g.closePath(); g.fill(); g.stroke();
  g.fillRect(x, y, w, h); g.strokeRect(x, y, w, h); g.restore();
}
function cyl(g, cx, cy, rx, ry, h, amt, pal) {
  const bot = cy + h;
  g.beginPath(); g.moveTo(cx - rx, cy); g.lineTo(cx - rx, bot); g.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true);
  g.lineTo(cx + rx, cy); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI, true); g.closePath();
  g.save(); g.fillStyle = pal.bg; g.fill(); g.clip();
  g.globalAlpha = 0.85; g.fillStyle = pal.acc; g.fillRect(cx - rx - 2, bot + ry - amt * (h + ry), rx * 2 + 4, h + ry * 2);
  g.restore(); g.stroke();
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.save(); g.fillStyle = pal.bg; g.fill(); g.restore(); g.stroke();
}

  if (c.width !== Math.round(cw * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }

  const [br, bg, bb] = pal.bg, [lr, lg, lb] = pal.line, [r1, g1, b1] = pal.bass, [r2, g2, b2] = pal.mid, [r3, g3, b3] = pal.high;
  const d = st.img.data, n = line.n, H_ = st.h;
  for (let p = 0; p < n; p++) {
    const iL = line.dl[p], iR = line.dr[p], cov = line.cov[p] / 255;
    let bs = 0, md = 0, hi = 0;
    if (iL < 255) { bs = H_.lb[iL]; md = H_.lm[iL]; hi = H_.lh[iL]; }
    if (iR < 255) { bs = Math.max(bs, H_.rb[iR]); md = Math.max(md, H_.rm[iR]); hi = Math.max(hi, H_.rh[iR]); }
    const I = Math.min(1, Math.max(0, Math.max(bs, md, hi) - 0.3) * 1.9), wb = Math.pow(bs, 6), wm = Math.pow(md, 6), wh = Math.pow(hi, 6), tot = wb + wm + wh + 1e-6;
    const lr2 = (r1 * wb + r2 * wm + r3 * wh) / tot, lg2 = (g1 * wb + g2 * wm + g3 * wh) / tot, lb2 = (b1 * wb + b2 * wm + b3 * wh) / tot;

  g.setTransform(s, 0, 0, s, (c.width - W * s) / 2, (c.height - H * s) / 2);

  const tr_ = TRACKS[ti];
  if (o.text) {
    const T2 = (t, x, y, size, col, al = 'left', wt = 700, ls = 0) => { g.font = `${wt} ${size}px ${HELV}`; g.letterSpacing = `${ls}px`; g.textAlign = al; g.fillStyle = col; g.fillText(t, x, y); g.letterSpacing = '0px'; };
    const words = tr_.title.split(/\s+/); let fit = null;
    for (let size = 34; size >= 16 && !fit; size--) { g.font = `700 ${size}px ${HELV}`; const lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width <= 200 || !cur) cur = t; else { lines.push(cur); cur = w; } } lines.push(cur); if (lines.length <= 3 && lines.every((l) => g.measureText(l).width <= 200)) fit = { size, lines }; }
    fit = fit || { size: 16, lines: [tr_.title] };
    const y0 = 686 - (fit.lines.length - 1) * fit.size * 1.02;
    fit.lines.forEach((l, i) => T2(l, 22, y0 + i * fit.size * 1.02, fit.size, pal.ink, 'left', 700, -0.6));
    const y = 686 + fit.size * 0.6 + 14;
    T2(tr_.name, 22, y, 12, pal.mute, 'left', 500, 0.2); T2(`${tr_.album || ''}${tr_.year ? ' · ' + tr_.year : ''}`, 22, y + 15, 11, pal.mute, 'left', 500, 0.2);
    T2(`${tr_.codec} ${tr_.bits}${tr_.dr ? ' · ' + tr_.dr : ''}`, 22, y + 30, 11, pal.mute, 'left', 500, 0.2); T2(`${mmss(o.played * tr_.dur)} / ${mmss(tr_.dur)}`, 22, y + 45, 11, pal.mute, 'left', 500, 0.2);
  }
}

const cards = PALS.map(([label, pal]) => {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  f.append(c, cap);
  $('grid').append(f);
  return { c, pal, st: null };
});

const field = new Image();
field.onload = () => {
  const cv = document.createElement('canvas'); cv.width = MW; cv.height = MH; const cx = cv.getContext('2d'); cx.drawImage(field, 0, 0); const px = cx.getImageData(0, 0, MW, MH).data;
  let n = 0; for (let i = 0; i < MW * MH; i++) if (px[i * 4 + 2] > 12) n++;
  line = { n, idx: new Uint32Array(n), dl: new Uint8Array(n), dr: new Uint8Array(n), cov: new Uint8Array(n) };
  let k = 0; for (let i = 0; i < MW * MH; i++) if (px[i * 4 + 2] > 12) { line.idx[k] = i; line.dl[k] = px[i * 4]; line.dr[k] = px[i * 4 + 1]; line.cov[k] = px[i * 4 + 2]; k++; }
  cards.forEach((kd) => {
    const off = document.createElement('canvas'); off.width = MW; off.height = MH; const ctx = off.getContext('2d'); const img = ctx.createImageData(MW, MH);
    for (let i = 0; i < MW * MH; i++) { img.data[i * 4] = kd.pal.bg[0]; img.data[i * 4 + 1] = kd.pal.bg[1]; img.data[i * 4 + 2] = kd.pal.bg[2]; img.data[i * 4 + 3] = 255; }
    const h = {}; for (const key of ['lb', 'lm', 'lh', 'rb', 'rm', 'rh']) h[key] = new Float32Array(HN);
    kd.st = { b: new Array(NB).fill(0), off, ctx, img, h, acc: 0 };
  });
  let clock = 0, last = performance.now();
  // fill the history with eight seconds of music so the tracks are lit when the page opens
  for (let i = 0; i < 200; i++) { clock += 0.04; const mean = 0; const bands = fakeBands(clock, 1.15), m = bands.reduce((a, b) => a + b, 0) / NB; cards.forEach((kd) => advance(kd.st, { dt: 0.04, bands, l: clamp(m * (1.45 + 0.3 * Math.sin(clock * 0.7))), r: clamp(m * (1.45 - 0.3 * Math.sin(clock * 0.7))) })); }
  const frame = (now) => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
    const auto = $('auto').checked, bands = fakeBands(clock, auto ? 1.15 : +$('lvl').value * 2), m = bands.reduce((a, b) => a + b, 0) / NB;
    const o = { dt, bands, l: clamp(m * (1.45 + 0.3 * Math.sin(clock * 0.7))), r: clamp(m * (1.45 - 0.3 * Math.sin(clock * 0.7))), played: (clock % 40) / 40, text: $('text').checked };
    cards.forEach((kd) => { advance(kd.st, o); render(kd.c, kd.pal, kd.st, o); });
    requestAnimationFrame(frame);
  };
  $('next').onclick = () => { ti = (ti + 1) % TRACKS.length; };
  requestAnimationFrame(frame);
};
field.src = FIELD_SRC;
</script>
