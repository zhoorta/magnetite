[package]
name = "magnetite-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal client for Magnetite"
license = "AGPL-3.0-or-later"

[[bin]]
name = "magnetite"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
ebur128 = "0.1.11"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-opus-rs = "0.1.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
